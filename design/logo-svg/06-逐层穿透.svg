<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="逐层穿透">
  <title>逐层穿透</title>
  <!--
    含义：一支箭头连续穿过上下两层边界。
    两条横线代表"一层层的内网边界"，箭头从最底下一直穿到最上面。
    对应"内网穿透"——穿的不止一道墙。
  -->
  <rect x="6"  y="22" width="18" height="6" rx="3" fill="currentColor"/>
  <rect x="40" y="22" width="18" height="6" rx="3" fill="currentColor"/>
  <rect x="6"  y="40" width="18" height="6" rx="3" fill="currentColor"/>
  <rect x="40" y="40" width="18" height="6" rx="3" fill="currentColor"/>
  <rect x="28.5" y="16" width="7" height="42" rx="3.5" fill="currentColor"/>
  <path d="M32 5 L44 20 L20 20 Z" fill="currentColor"/>
</svg>
