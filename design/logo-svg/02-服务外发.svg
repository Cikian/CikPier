<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="服务外发">
  <title>服务外发</title>
  <!--
    含义：把本机里的服务送出去。
    下方是一个开口朝上的容器（代表本机 / 内网），
    箭头从容器内部向上穿出到容器之外（代表服务被发布到公网）。
  -->
  <path d="M12 24 V48 a6 6 0 0 0 6 6 H46 a6 6 0 0 0 6-6 V24"
        fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
  <rect x="28.5" y="18" width="7" height="30" rx="3.5" fill="currentColor"/>
  <path d="M20 24 L32 7 L44 24 Z" fill="currentColor"/>
</svg>
